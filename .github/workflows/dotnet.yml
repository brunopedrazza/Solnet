name: .NET

on:
  push:
    branches: [ master, net5 ]
  pull_request:
    branches: [ master, net5 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET SDK 6.x
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 6.0.x

      - name: Ensure .NET 6 Runtime is Installed
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --runtime dotnet --version 6.0.29
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check out Code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Run Cake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install Cake.Tool --version 1.1.0
          dotnet tool restore
          dotnet cake --target=Report --verbosity=verbose

      - name: Publish coverage report to coveralls.io
        uses: coverallsapp/github-action@v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: code_coverage/results.info